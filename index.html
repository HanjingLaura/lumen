<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Lumen</title>
    <link rel="stylesheet" href="/lumen/styles.css" />
  </head>
  <body>
    <main class="scene" id="scene" data-scene="1">
      <canvas id="sceneCanvas" aria-hidden="true"></canvas>
      <span class="scene-mark" id="sceneMark">1</span>
      <button class="bench-entry" id="benchEntry" type="button">调试</button>
    </main>

    <dialog class="bench" id="bench" aria-labelledby="benchTitle">
      <header class="bench-head">
        <h1 id="benchTitle">硬件调试</h1>
        <button class="bench-close" id="benchClose" type="button">关闭</button>
      </header>
      <p class="bench-status"><span class="status-dot" id="connectionDot"></span><span id="connectionLabel">Mock 模式</span></p>
      <button class="bench-button" id="connectButton" type="button">连接 Lumen 按键</button>
      <p class="bench-note" id="bluetoothNote">安全上下文（HTTPS 或 localhost）下可连接 Web Bluetooth。</p>
      <div class="key-grid" id="keyGrid"></div>
      <div class="mapping-grid" id="mappingGrid"></div>
      <button class="bench-text" id="resetMapButton" type="button">恢复默认映射</button>
      <p class="bench-toast" id="toast" role="status" aria-live="polite"></p>
    </dialog>
    <script src="/lumen/vendor/raindrop-fx/index.js"></script>
    <script type="module" src="/lumen/src/app.js"></script>
  </body>
</html>
